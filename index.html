<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Measurements and Colors</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
        }

        h1 {
            color: navy;
            text-align: center;
        }

        .box {
            width: 400px;
            height: 200px;
            background-color: lightblue;
            border: 3px solid darkblue;
            padding: 20px;
            margin: 30px auto;
        }

        p {
            font-size: 18px;
            color: #333333;
            line-height: 1.6;
        }

        .highlight {
            color: white;
            background-color: green;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS Measurements and Colors</h1>

    <div class="box">

        <p>
            This box uses CSS <strong>measurements</strong> such as
            width, height, margin, padding, and border.
        </p>

        <p class="highlight">
            This text demonstrates foreground and background colors.
        </p>

    </div>

</body>
</html>
